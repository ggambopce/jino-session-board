<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세션 보드</title>
<style>
/* ===== 색: 기본은 어두운 화면(GitHub Dark 계열). 면 · 선 · 글자 단계는 글자색을 섞어 만든다 ===== */
:root {
  --bg:#1f2428; --fg:#d1d5da; --muted:#959da5; --strong:#e1e4e8; --pop:#24292e; --shadow:rgba(0,0,0,.45);
  --accent:#2188ff; --line-accent:#005cc5; --bar:#0366d6; --link:#79b8ff;
  --ok:#89d185; --bad:#f97583; --run:#59a4f9; --warn:#e3b341;
  --c-blue:#59a4f9; --c-purple:#b392f0; --c-green:#89d185; --c-orange:#ffab70; --c-yellow:#ffdf5d; --c-red:#f97583; --c-cyan:#56d4dd;
  --sans:"Segoe WPC","Segoe UI",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:Consolas,"Cascadia Mono","SF Mono",Menlo,"D2Coding",monospace;
  --r:8px;
  color-scheme:dark;
}
:root[data-theme="light"] {
  --bg:#ffffff; --fg:#24292e; --muted:#6a737d; --strong:#1b1f23; --pop:#ffffff; --shadow:rgba(27,31,35,.18);
  --accent:#0366d6; --line-accent:#0366d6; --bar:#0366d6; --link:#0366d6;
  --ok:#22863a; --bad:#cb2431; --run:#0366d6; --warn:#b08800;
  --c-blue:#0366d6; --c-purple:#6f42c1; --c-green:#28a745; --c-orange:#e36209; --c-yellow:#dbab09; --c-red:#d73a49; --c-cyan:#1b9aaa;
  color-scheme:light;
}
:root {
  --surface:color-mix(in srgb, var(--fg) 4%, transparent);
  --surface-2:color-mix(in srgb, var(--fg) 8%, transparent);
  --line:color-mix(in srgb, var(--fg) 12%, transparent);
  --hover:color-mix(in srgb, var(--fg) 7%, transparent);
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { background:var(--bg); }
body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.6 var(--sans); word-break:keep-all; overflow-wrap:anywhere; -webkit-font-smoothing:antialiased; }
button, input { font:inherit; color:inherit; }
a { color:var(--link); text-decoration:none; cursor:pointer; }
a:hover { text-decoration:underline; }
:focus-visible { outline:1px solid var(--accent); outline-offset:2px; border-radius:4px; }
.wrap { max-width:1040px; margin:0 auto; padding:0 16px; }

/* ===== 머리: 제목 한 줄, 그 아래 탭 줄 ===== */
header.top { position:sticky; top:0; z-index:5; background:var(--bg); }
.titlerow { display:flex; align-items:center; gap:12px; padding-top:14px; margin-bottom:10px; min-width:0; }
.title { flex:1; min-width:0; font-size:13px; font-weight:600; color:var(--strong); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.state { flex:none; display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap; }
.state.run { color:var(--run); } .state.bad { color:var(--bad); }
nav { position:relative; display:flex; align-items:center; gap:8px; border-bottom:1px solid color-mix(in srgb, var(--fg) 10%, transparent); }
/* 탭이 폭을 넘으면 가로로 밀어 본다. 막대는 숨긴다 */
#tabs { flex:1; min-width:0; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
#tabs::-webkit-scrollbar { display:none; }
#tabs button { all:unset; position:relative; flex:none; display:inline-flex; align-items:center; white-space:nowrap; cursor:pointer; padding:6px 8px 9px; font-weight:500; color:var(--muted); transition:color .2s; }
#tabs button:hover { color:var(--fg); }
#tabs button.on { color:var(--strong); }
#tabs button:focus-visible { outline:1px solid var(--accent); outline-offset:-2px; border-radius:4px; }
#tabs .ti { display:flex; opacity:.8; }
#tabs button.on .ti { opacity:1; color:var(--accent); }
/* 이름 · 숫자는 너비와 투명도로 펼치고 접는다(좁은 폭에서 탭을 바꿀 때 툭 튀지 않게) */
#tabs .lb, #tabs .n { max-width:120px; margin-left:6px; overflow:hidden; white-space:nowrap; transition:max-width .26s cubic-bezier(.2,.8,.2,1), margin-left .26s cubic-bezier(.2,.8,.2,1), opacity .2s ease; }
#tabs .n { display:inline-block; padding:1px 6px; line-height:14px; border-radius:10px; font-size:11px; font-weight:500; background:var(--surface-2); color:var(--muted); font-variant-numeric:tabular-nums; }
#tabs button.on .n { background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--strong); }
/* 탭 밑줄은 하나만 두고 고른 탭 아래로 미끄러뜨린다 */
#ind { position:absolute; left:0; bottom:-1px; height:2px; width:0; border-radius:1px; background:var(--line-accent); pointer-events:none; transition:transform .25s cubic-bezier(.2,.8,.2,1), width .25s cubic-bezier(.2,.8,.2,1); }
#colbtn { all:unset; flex:none; display:flex; align-items:center; justify-content:center; width:28px; height:28px; margin-bottom:4px; border:1px solid var(--line); border-radius:6px; color:var(--muted); cursor:pointer; transition:color .15s, background .15s; }
#colbtn:hover, #colbtn.on { color:var(--fg); background:var(--hover); }
#colbtn:focus-visible { outline:1px solid var(--accent); }
/* 좁으면 안 고른 탭은 아이콘만. 숫자 대신, 확인할 게 있는 탭(안 읽은 보고 · 실행 중)에만 점 */
@media (max-width:720px) {
  #tabs { gap:0; }
  #tabs button:not(.on) .lb, #tabs button:not(.on) .n:not(.alert) { max-width:0; margin-left:0; opacity:0; }
  #tabs button:not(.on) .n.alert { position:absolute; top:4px; right:3px; width:6px; height:6px; margin:0; padding:0; font-size:0; border-radius:3px; background:var(--run); transition:none; }
}

/* ===== 설정 메뉴: 탭 보이기 · 순서, 테마, 알림 ===== */
#menu { position:absolute; right:0; top:calc(100% + 6px); z-index:6; width:264px; max-width:calc(100vw - 32px); padding:8px 0 6px; background:var(--pop); border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px var(--shadow); opacity:0; visibility:hidden; transform:translateY(-6px); pointer-events:none; transition:opacity .18s ease, transform .22s cubic-bezier(.2,.8,.2,1), visibility 0s linear .22s; }
#menu.on { opacity:1; visibility:visible; transform:none; pointer-events:auto; transition:opacity .18s ease, transform .22s cubic-bezier(.2,.8,.2,1); }
.mh { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:2px 14px 6px; font-size:12px; font-weight:500; color:var(--muted); }
.mnote { padding:0 14px 6px; font-size:12px; color:var(--run); }
#tablist { list-style:none; margin:0; padding:0; }
#tablist li { display:flex; align-items:center; gap:8px; padding:5px 14px; background:var(--pop); }
#tablist li:hover { background:var(--hover); }
#tablist li.dragging { position:relative; z-index:1; box-shadow:0 2px 8px var(--shadow); }
#tablist label { flex:1; display:flex; align-items:center; gap:8px; cursor:pointer; }
#tablist input, .mrow input { width:15px; height:15px; margin:0; accent-color:var(--bar); cursor:pointer; }
#tablist input:disabled { opacity:.5; cursor:default; }
.grip { flex:none; display:flex; color:var(--muted); cursor:grab; touch-action:none; }
.mf { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px; padding:8px 14px 6px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
.mf button, .seg button { all:unset; cursor:pointer; }
.mf button { flex:none; font-size:12px; color:var(--link); white-space:nowrap; }
.msec { margin-top:4px; padding-top:8px; border-top:1px solid var(--line); }
.mrow { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:5px 14px; }
.seg { display:flex; gap:2px; padding:2px; border-radius:6px; background:var(--surface-2); }
.seg button { padding:1px 10px; border-radius:4px; font-size:12px; color:var(--muted); }
.seg button.on { background:var(--pop); color:var(--strong); box-shadow:0 0 0 1px var(--line); }
.seg button:focus-visible { outline:1px solid var(--accent); }

/* ===== 본문 공용 ===== */
main.wrap { padding-top:18px; padding-bottom:32px; min-height:50vh; }
h2 { font-size:15px; font-weight:600; margin:0; color:var(--strong); }
h3 { font-size:12px; font-weight:500; margin:24px 0 8px; color:var(--muted); }
#pane > div > h3:first-child { margin-top:0; }
p { margin:8px 0; }
.muted { color:var(--muted); }
.small { font-size:12px; }
.memo { display:block; margin-top:1px; font-size:12px; color:var(--muted); }
.grow { flex:1; min-width:0; }
.one { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* 목록은 옅은 면 카드 하나로 묶고, 안은 선 한 겹으로 나눈다 */
.card { padding:0 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); }
.list > * { padding:10px 0; border-bottom:1px solid var(--line); }
.list > :last-child { border-bottom:0; }
.row { display:flex; align-items:flex-start; gap:8px; }
.bar { height:6px; margin:8px 0 4px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
.bar i { display:block; height:100%; border-radius:3px; background:var(--bar); transition:width .4s; }
.bar.warn i { background:var(--warn); }
.num { flex:none; min-width:64px; text-align:right; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
/* 배지: 옅은 면 + 같은 계열 글자 */
.badge { flex:none; display:inline-block; padding:2px 8px; line-height:14px; border-radius:10px; font-size:11px; font-weight:500; white-space:nowrap; background:var(--surface-2); color:var(--fg); }
.badge.running { background:color-mix(in srgb, var(--run) 18%, transparent); color:var(--run); }
.badge.done { background:color-mix(in srgb, var(--ok) 15%, transparent); color:var(--ok); }
.badge.failed { background:color-mix(in srgb, var(--bad) 16%, transparent); color:var(--bad); }
.badge.warn { background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn); }
.badge.stopped { color:var(--muted); }
.pulse { flex:none; display:inline-block; width:6px; height:6px; border-radius:3px; background:var(--run); animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:.25; } }
.sw { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer; }
.sw input { width:14px; height:14px; margin:0; accent-color:var(--bar); cursor:pointer; }
.btn2 { all:unset; box-sizing:border-box; cursor:pointer; padding:1px 10px; line-height:20px; border:1px solid var(--line); border-radius:6px; font-size:12px; color:var(--fg); white-space:nowrap; }
.btn2:hover { background:var(--hover); }
.btn2[disabled] { opacity:.45; cursor:default; background:none; }
.btn2:focus-visible { outline:1px solid var(--accent); }
pre { margin:4px 0 0; padding:8px 10px; max-height:320px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; word-break:normal; font:12px/1.5 var(--mono); background:var(--surface); border:1px solid var(--line); border-radius:4px; }
code { font:12px var(--mono); }
/* 빈 화면: 탭 아이콘을 둥근 면 위에 올리고 안내 문장 */
.empty { display:flex; flex-direction:column; align-items:center; gap:10px; padding:40px 16px; text-align:center; color:var(--muted); }
.empty .eic { width:44px; height:44px; border-radius:22px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--fg); }
.empty p { margin:0; max-width:320px; }
footer.wrap { padding-bottom:24px; font-size:12px; color:var(--muted); }

/* ===== 펼침 공용: 높이는 grid 0fr 에서 1fr 로 미끄러지고, 함께 페이드 ===== */
.exp-head { display:flex; align-items:flex-start; gap:8px; cursor:pointer; }
.exp-head:focus-visible { outline:1px solid var(--accent); outline-offset:3px; }
.exp-body { display:grid; grid-template-rows:0fr; opacity:0; visibility:hidden; transform:translateY(-6px); transition:grid-template-rows .28s cubic-bezier(.2,.8,.2,1), opacity .2s ease, transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s linear .28s; }
.exp-body > div { overflow:hidden; min-height:0; }
.exp.open > .exp-body { grid-template-rows:1fr; opacity:1; visibility:visible; transform:none; transition:grid-template-rows .28s cubic-bezier(.2,.8,.2,1), opacity .2s ease, transform .28s cubic-bezier(.2,.8,.2,1); }
.chev { flex:none; width:16px; text-align:center; color:var(--muted); transition:transform .28s cubic-bezier(.2,.8,.2,1); }
.exp.open > .exp-head .chev { transform:rotate(90deg); }

/* ===== 진행판 ===== */
.hero { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.hero .pct { flex:none; font-size:12px; color:var(--muted); }
.step { display:flex; gap:8px; }
/* 아이콘 칸 높이를 첫 줄 높이와 같게 두고 가운데 맞춤 */
.ic { flex:none; width:18px; height:1.6em; display:flex; align-items:center; justify-content:center; }
.ic svg { display:block; }
.step .t { display:block; }
.step.now .t { font-weight:600; color:var(--strong); }

/* ===== 결과보고 ===== */
.reptop { display:flex; justify-content:flex-end; margin-bottom:10px; }
.rep { padding:12px 0 !important; }
.rep .t { font-weight:600; color:var(--strong); }
.badge.by { margin-right:6px; padding:1px 7px; vertical-align:1px; }
.rep .memo .badge { margin-left:6px; padding:0 6px; line-height:16px; vertical-align:1px; }
.peek { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-height:3.2em; margin-top:2px; font-size:12px; color:var(--muted); transition:opacity .2s ease, max-height .28s cubic-bezier(.2,.8,.2,1); }
.exp.open .peek { opacity:0; max-height:0; }
.unread { flex:none; width:7px; height:7px; margin-top:7px; border-radius:50%; background:var(--run); }
.readpad { flex:none; width:7px; }
/* 그 턴에 바꾼 파일 · 캡처 · 검사 */
.tb { display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px 12px; align-items:start; margin:10px 0 8px; padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:6px; font-size:12px; }
.tb .k { line-height:22px; color:var(--muted); white-space:nowrap; }
.tb .v { display:flex; flex-wrap:wrap; gap:6px; min-width:0; }
.tb .v.text { display:block; padding-top:2px; white-space:pre-wrap; color:var(--fg); }
.tb .badge { line-height:18px; }
.chip { all:unset; box-sizing:border-box; max-width:100%; padding:2px 8px; line-height:18px; border-radius:6px; background:var(--surface-2); color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
button.chip { cursor:pointer; color:var(--link); }
button.chip:hover { text-decoration:underline; }
button.chip:focus-visible { outline:1px solid var(--accent); }
.shot { all:unset; cursor:zoom-in; width:64px; height:44px; border-radius:4px; overflow:hidden; box-shadow:0 0 0 1px var(--line); }
.shot img { display:block; width:100%; height:100%; object-fit:cover; }
.fail { width:100%; }
.fail code { color:var(--bad); }

/* ===== 마크다운 ===== */
.md { margin-top:4px; padding:10px 12px; border-radius:6px; background:var(--surface); border:1px solid var(--line); line-height:1.6; }
.md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
.md h4 { margin:14px 0 6px; font-size:13px; font-weight:600; color:var(--strong); }
.md p, .md ul, .md ol, .md blockquote, .md .tw, .md pre { margin:6px 0; }
.md ul, .md ol { padding-left:22px; }
.md li { padding:1px 0; }
.md li > ul, .md li > ol { margin:2px 0; }
.md strong { font-weight:600; color:var(--strong); }
.md code { padding:1px 4px; border-radius:3px; background:var(--surface-2); }
.md pre { background:var(--bg); }
.md pre code { padding:0; background:none; }
.md blockquote { padding:0 0 0 10px; border-left:3px solid var(--line); color:var(--muted); }
.md hr { margin:12px 0; border:0; border-top:1px solid var(--line); }
.md .tw { overflow-x:auto; }
.md table { border-collapse:collapse; font-size:12px; }
.md th, .md td { padding:4px 8px; border:1px solid var(--line); text-align:left; vertical-align:top; }
.md th { font-weight:600; background:var(--surface); }

/* ===== 컨텍스트 ===== */
.bigrow { display:flex; align-items:baseline; gap:8px; }
.big { font-size:28px; font-weight:600; line-height:1.2; letter-spacing:-.02em; color:var(--strong); }
.bar.stack { display:flex; height:8px; margin:10px 0 6px; border-radius:4px; }
.bar.stack i { flex:none; border-radius:0; }
.bar.stack i + i { margin-left:1px; }
.bar.stack .buf { margin-left:auto; background:repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 4px); opacity:.5; }
.kv { display:flex; justify-content:space-between; gap:16px; }
.kv > :first-child { flex:none; }
.kv > :last-child { min-width:0; text-align:right; }
.mini { display:block; height:4px; margin:4px 0 2px; border-radius:2px; background:var(--surface-2); overflow:hidden; }
.mini i { display:block; height:100%; border-radius:2px; }
.dot { flex:none; width:8px; height:8px; margin-top:7px; border-radius:50%; }
.lim .bar { margin:4px 0 2px; }

/* ===== 에이전트 ===== */
.ag .grow > b { font-weight:500; color:var(--strong); }
.ag .exp-head:hover .grow > b { text-decoration:underline; }
.ag .now { display:flex; align-items:center; gap:6px; margin-top:2px; font-size:12px; color:var(--fg); overflow:hidden; white-space:nowrap; }
.ag .now span { overflow:hidden; text-overflow:ellipsis; }
.sub { padding-top:2px; }
.sub h4 { margin:12px 0 6px; font-size:12px; font-weight:500; color:var(--muted); }
.prompt { padding:10px 12px; max-height:6.4em; overflow:hidden; white-space:pre-wrap; font-size:12px; background:var(--surface); border:1px solid var(--line); border-radius:6px; -webkit-mask-image:linear-gradient(#000 60%, transparent); mask-image:linear-gradient(#000 60%, transparent); }
.prompt.full { max-height:none; -webkit-mask-image:none; mask-image:none; }
.more { all:unset; margin-top:6px; font-size:12px; color:var(--link); cursor:pointer; }
.more:focus-visible { outline:1px solid var(--accent); }
.acts { border:1px solid var(--line); border-radius:6px; font-size:12px; }
.acts > div { display:flex; align-items:center; gap:10px; padding:5px 12px; }
.acts > div + div { border-top:1px solid var(--line); }
.acts .br { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.acts .tm { flex:none; color:var(--muted); font-variant-numeric:tabular-nums; }
.acts .tx .br { color:var(--muted); }

/* ===== 코덱스 ===== */
.finding { padding:8px 0; border-top:1px solid var(--line); }
.finding:first-child { border-top:0; }
.finding .path { font:12px var(--mono); color:var(--muted); }
.sev { flex:none; padding:0 7px; line-height:18px; border-radius:9px; font-size:11px; font-weight:500; white-space:nowrap; }
.sev.critical { color:var(--bad); background:color-mix(in srgb, var(--bad) 16%, transparent); }
.sev.major { color:var(--warn); background:color-mix(in srgb, var(--warn) 16%, transparent); }
.sev.minor { color:var(--run); background:color-mix(in srgb, var(--run) 16%, transparent); }
.sev.note { color:var(--muted); background:var(--surface-2); }

/* ===== 결과물 ===== */
.outtop { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; min-height:26px; margin-bottom:12px; font-size:12px; color:var(--muted); }
.out { padding:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
.tile { min-width:0; }
.thumb { all:unset; box-sizing:border-box; display:block; width:100%; aspect-ratio:4/3; border-radius:6px; overflow:hidden; cursor:zoom-in; background:var(--surface-2); box-shadow:0 0 0 1px var(--line); }
.thumb img { display:block; width:100%; height:100%; object-fit:cover; transition:transform .2s; }
.thumb:hover img { transform:scale(1.03); }
.thumb:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.thumb.gone { display:flex; align-items:center; justify-content:center; padding:8px; cursor:default; font-size:12px; color:var(--muted); text-align:center; }

// 검사는 종류별로 마지막 결과만. 여러 번 돌렸으면 횟수
const checkList = r => { const m = new Map(); for (const c of r.checks || []) { const x = m.get(c.kind) || { kind: c.kind, n: 0 }; x.n++; x.status = c.status; x.command = c.command; x.output = c.output; m.set(c.kind, x) } return [...m.values()] }
function checkSum(r) {
  const l = checkList(r); if (!l.length) return null
  const bad = l.filter(x => x.status === 'fail').length
  return bad ? badge('failed', '검사 ' + bad + '개 실패') : l.every(x => x.status === 'pass') ? badge('done', '검사 통과') : badge('running', '검사 도는 중')
}
function fileChip(p) {

  const c = el(known ? 'button' : 'span', 'chip', rel(p)); c.title = p
  if (known) { c.type = 'button'; c.onclick = () => openPath('file', p) }
  return c
}

  const shots = (r.images || []).filter(x => x.src)
  if (shots.length) add('캡처', el('div', 'v', ...shots.map((x, i) => { const b = el('button', 'shot'); b.type = 'button'; b.title = base(x.path); const im = el('img'); im.src = x.src; im.alt = base(x.path); im.loading = 'lazy'; b.append(im); b.onclick = () => showView(shots, i); return b })))
  const cl = checkList(r)
  if (cl.length) {
    const v = el('div', 'v')

}

function ctxInfo() {

  if (live.length > 1) {
    const cmp = el('button', 'btn2', '두 장 비교 (' + picked.length + '/2)'); cmp.type = 'button'; cmp.disabled = picked.length !== 2; cmp.onclick = () => showView(picked.map(p => live.find(i => i.path === p)), 0, true)
    w.append(el('div', 'outtop', el('span', '', '두 장을 고르면 나란히 비교해요.'), cmp))
  }
  const g = el('div', 'grid')
  for (const im of D.images) {
    const t = el('div', 'tile' + (picked.includes(im.path) ? ' picked' : ''))
    if (im.src) { const b = el('button', 'thumb'); b.type = 'button'; b.title = im.path; b.setAttribute('aria-label', base(im.path) + ' 크게 보기'); const n = el('img'); n.src = im.src; n.alt = base(im.path); n.loading = 'lazy'; b.append(n); b.onclick = () => showView(live, live.indexOf(im)); t.append(b) }
    else t.append(el('span', 'thumb gone', '지워진 파일이에요'))
    const nm = el('span', '', base(im.path)); nm.title = im.path
    const cap = el('div', 'cap', nm)
    if (im.src && live.length > 1) { const ck = el('input'); ck.type = 'checkbox'; ck.checked = picked.includes(im.path); ck.setAttribute('aria-label', '비교에 넣기'); ck.onchange = () => { picked = ck.checked ? [...picked, im.path].slice(-2) : picked.filter(p => p !== im.path); draw() }; cap.append(ck) }
    if (LIVE && im.src) { const o = el('button', 'btn2', '열기'); o.type = 'button'; o.onclick = () => openPath('image', im.path); cap.append(o) }
    t.append(cap, el('span', 'memo', [im.via, ago(im.at)].filter(Boolean).join(' · ')))
    g.append(t)
  }
  w.append(el('div', 'out', g))
  return w
}

P.urls = () => {
  if (!D.urls.length) return empty('urls', '대화에 나온 주소가 없어요. localhost 같은 미리보기 주소가 나오면 여기 모여요.')
  const w = el('div'), link = (u, cls) => { const a = el('a', cls, u); a.href = u; a.target = '_blank'; a.rel = 'noreferrer noopener'; a.title = u; return a }
  const local = D.urls.filter(u => u.local).sort((a, b) => (b.alive === true) - (a.alive === true)), other = D.urls.filter(u => !u.local)
  if (local.length) {
    w.append(el('h3', '', '내 컴퓨터 주소'))
    const card = el('div', 'card list')
    for (const u of local) {
      const st = u.alive === true ? '켜짐' : u.alive === false ? '꺼짐' : LIVE ? '확인 중' : '로컬'
      const dot = el('span', 'live' + (u.alive === true ? ' on' : u.alive === false ? ' off' : '')); dot.title = st
      const row = el('div', 'row', dot, link(u.url, 'host grow'), el('span', 'memo', [st, ago(u.at) ? ago(u.at) + ' 언급' : ''].filter(Boolean).join(' · ')))
      if (D.lan) { try { const x = new URL(u.url); x.hostname = D.lan; const l = el('a', 'btn2', '사내 IP로 열기'); l.href = x.href; l.target = '_blank'; l.rel = 'noreferrer noopener'; l.title = x.href; row.append(l) } catch {} }
      card.append(el('div', 'srv' + (u.alive === true ? '' : ' off'), row))
    }
    w.append(card)
    if (!LIVE) w.append(el('p', 'muted small', '주소가 켜져 있는지는 실시간 보드(--serve)에서만 확인해요.'))
  }
  if (other.length) {
    w.append(el('h3', '', '그 밖의 주소'))
    w.append(el('div', 'card list', ...other.map(u => el('div', 'row', link(u.url, 'grow'), el('span', 'memo', ago(u.at) ? ago(u.at) + ' 언급' : '')))))
  }
  return w
}

P.files = () => {
  if (!D.files.length) return empty('files', '이 세션에서 바꾼 파일이 없어요.')
  const w = el('div'), card = el('div', 'card list')
  for (const f of D.files) {
    const name = el(LIVE ? 'a' : 'span', '', rel(f.path)); name.title = f.path
    if (LIVE) { name.setAttribute('role', 'button'); name.tabIndex = 0; name.onclick = () => openPath('file', f.path); name.onkeydown = e => { if (e.key === 'Enter') openPath('file', f.path) } }
    card.append(el('div', 'row', el('span', 'grow', name, el('span', 'memo', f.count + '번 수정' + (f.last ? ' · ' + ago(f.last) : ''))), f.created ? badge('', '새 파일') : null))
  }
  w.append(card, el('p', 'muted small', 'Claude 가 편집 도구로 고친 파일만 잡혀요. 셸 명령으로 만든 파일은 빠져요.' + (LIVE ? ' 이름을 누르면 기본 프로그램으로 열려요.' : '')))
  return w
}

// ---- 탭 줄과 설정 ----
const TABS = [['board', '진행판'], ['reports', '결과보고'], ['context', '컨텍스트'], ['agents', '에이전트'], ['codex', '코덱스'], ['images', '결과물'], ['urls', '주소'], ['files', '바뀐 파일']]
const NAME = Object.fromEntries(TABS)
const ALERT = new Set(['reports', 'agents', 'codex'])
const prefKey = () => 'sb:tabs:' + D.session.id
function prefs() {
  const own = store.get(prefKey(), null), p = own || store.get('sb:tabs', null) || {}
  const order = (p.order || []).filter(id => NAME[id]); for (const [id] of TABS) if (!order.includes(id)) order.push(id)
  return { order, hidden: (p.hidden || []).filter(id => NAME[id]), scoped: !!own }
}
function savePrefs(p) { const v = { order: p.order, hidden: p.hidden }; if (p.scoped) store.set(prefKey(), v); else { store.del(prefKey()); store.set('sb:tabs', v) } }
let active = store.get('sb:active', 'board')
function counts() {
  const b = D.board
  return {
    board: b && b.total ? b.done + '/' + b.total : '',
    reports: turns().filter(r => !read.has(r.id)).length || '',
    context: D.context.tokens || D.context.usage ? ctxInfo().pct + '%' : '',
    agents: D.agents.filter(a => a.status === 'running').length || '',
    codex: D.codex.calls.filter(c => c.status === 'running').length || '',
    images: D.images.length || '',
    urls: D.urls.filter(u => u.local && u.alive === true).length || '',
    files: D.files.length || '',
  }
}
let tabSig = ''
function drawTabs() {
  const p = prefs(), shown = p.order.filter(id => !p.hidden.includes(id))
  if (!shown.includes(active)) active = shown[0]
  const c = counts(), sig = shown.map(id => id + ':' + c[id] + (id === active ? '*' : '')).join('|')
  if (sig !== tabSig) {
    tabSig = sig
    const box = $('tabs'); box.replaceChildren()
    for (const id of shown) {
      const b = el('button', id === active ? 'on' : '', el('span', 'ti', icon(id)), el('span', 'lb', NAME[id]))
      b.type = 'button'; b.dataset.tab = id; b.title = NAME[id]; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(id === active)); b.setAttribute('aria-controls', 'pane'); b.tabIndex = id === active ? 0 : -1
      if (c[id] !== '') b.append(el('span', 'n' + (ALERT.has(id) ? ' alert' : ''), String(c[id])))
      box.append(b)
    }
  }
  followInd()
}
function placeInd() {
  const on = document.querySelector('#tabs .on'), ind = $('ind'), tabs = $('tabs')
  if (!on) { ind.style.width = '0'; return }
  ind.style.width = on.offsetWidth + 'px'
  ind.style.transform = 'translateX(' + (on.offsetLeft - tabs.scrollLeft) + 'px)'
}
// 이름 너비가 바뀌는 0.3초 동안 밑줄 위치를 매 장면 다시 잰다
let indUntil = 0
function followInd() {
  const go = !indUntil
  indUntil = performance.now() + 320
  placeInd()
  if (go) requestAnimationFrame(function f(t) { placeInd(); if (t < indUntil) requestAnimationFrame(f); else indUntil = 0 })
}
$('tabs').addEventListener('scroll', placeInd)
addEventListener('resize', placeInd)
function pick(id, focus) {
  const moved = id !== active
  active = id; store.set('sb:active', id); draw()
  if (moved) scrollTo(0, 0)
  const b = document.querySelector('#tabs .on'); if (b) { b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); if (focus) b.focus() }
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) pick(b.dataset.tab) })
$('tabs').addEventListener('keydown', e => {
  const all = [...$('tabs').children], i = all.indexOf(document.activeElement)
  if (i < 0) return
  const j = e.key === 'ArrowRight' ? (i + 1) % all.length : e.key === 'ArrowLeft' ? (i - 1 + all.length) % all.length : e.key === 'Home' ? 0 : e.key === 'End' ? all.length - 1 : -1
  if (j >= 0) { e.preventDefault(); pick(all[j].dataset.tab, true) }
})

const menu = $('menu'), colbtn = $('colbtn'), tablist = $('tablist')
colbtn.append(icon('settings'))
function renderMenu() {
  const p = prefs(), shown = p.order.filter(id => !p.hidden.includes(id)).length
  $('own').checked = p.scoped; $('ownNote').hidden = !p.scoped
  tablist.replaceChildren()
  for (const id of p.order) {
    const on = !p.hidden.includes(id), ck = el('input'); ck.type = 'checkbox'; ck.checked = on; ck.dataset.show = id
    if (on && shown === 1) { ck.disabled = true; ck.title = '탭은 하나 이상 보여야 해요' }
    const grip = el('span', 'grip', icon('grip', 14)); grip.title = '끌어서 순서 바꾸기 (체크 상자에서 Alt + 위아래 화살표로도 옮겨요)'
    const li = el('li', '', grip, el('label', '', ck, NAME[id])); li.dataset.key = id
    tablist.append(li)
  }
}
function changePrefs(fn) { const p = prefs(); fn(p); savePrefs(p); renderMenu(); draw() }
tablist.addEventListener('change', e => { const id = e.target.dataset.show; if (id) changePrefs(p => { p.hidden = e.target.checked ? p.hidden.filter(x => x !== id) : [...p.hidden, id] }) })
// 키보드로 순서 바꾸기: 체크 상자에서 Alt + 위아래 화살표
tablist.addEventListener('keydown', e => {
  const id = e.target.dataset && e.target.dataset.show
  if (!id || !e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return
  e.preventDefault()
  changePrefs(p => { const i = p.order.indexOf(id), j = i + (e.key === 'ArrowUp' ? -1 : 1); if (j >= 0 && j < p.order.length) [p.order[i], p.order[j]] = [p.order[j], p.order[i]] })
  const n = tablist.querySelector('[data-show="' + id + '"]'); if (n) n.focus()
})
// 끌어서 순서 바꾸기: 손잡이를 잡고 위아래로 옮기면 지나는 자리로 끼워 넣는다
let drag = null
tablist.addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (!g || e.button !== 0) return
  e.preventDefault(); drag = { item: g.closest('li'), id: e.pointerId }; drag.item.classList.add('dragging'); tablist.setPointerCapture(e.pointerId)
})
tablist.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return
  const items = [...tablist.children], y = e.clientY, over = items.find(li => { if (li === drag.item) return false; const r = li.getBoundingClientRect(); return y > r.top && y < r.bottom })
  if (!over) return
  const r = over.getBoundingClientRect(), mid = r.top + r.height / 2, i = items.indexOf(drag.item), j = items.indexOf(over)
  if (j > i && y > mid) tablist.insertBefore(drag.item, over.nextSibling)
  else if (j < i && y < mid) tablist.insertBefore(drag.item, over)
})
const dragEnd = e => { if (!drag || e.pointerId !== drag.id) return; drag.item.classList.remove('dragging'); drag = null; const keys = [...tablist.children].map(li => li.dataset.key); changePrefs(p => { p.order = keys }) }
tablist.addEventListener('pointerup', dragEnd); tablist.addEventListener('pointercancel', dragEnd)
// 켜면 지금 공통 설정을 복사해 시작하고, 끄면 이 세션 설정을 지운다
$('own').onchange = e => { const p = prefs(); p.scoped = e.target.checked; savePrefs(p); renderMenu(); draw() }
$('reset').onclick = () => changePrefs(p => { p.order = TABS.map(t => t[0]); p.hidden = [] })
const setMenu = on => { menu.classList.toggle('on', on); colbtn.classList.toggle('on', on); colbtn.setAttribute('aria-expanded', String(on)) }
colbtn.onclick = () => { const on = !menu.classList.contains('on'); if (on) renderMenu(); setMenu(on) }
document.addEventListener('click', e => { if (menu.classList.contains('on') && !e.target.closest('#menu, #colbtn')) setMenu(false) })
document.addEventListener('keydown', e => { if (e.key === 'Escape' && menu.classList.contains('on')) { setMenu(false); colbtn.focus() } })

const applyTheme = t => { document.documentElement.dataset.theme = t; for (const b of document.querySelectorAll('.seg [data-theme]')) { b.classList.toggle('on', b.dataset.theme === t); b.setAttribute('aria-pressed', String(b.dataset.theme === t)) } }
applyTheme(store.get('sb:theme', 'dark'))
for (const b of document.querySelectorAll('.seg [data-theme]')) b.onclick = () => { store.set('sb:theme', b.dataset.theme); applyTheme(b.dataset.theme) }

// ---- 그리기 ----
let lost = false
function drawHead() {
  const t = D.session.title || '세션 ' + D.session.id.slice(0, 8)
  $('title').textContent = t; $('title').title = t
  document.title = t + ' · 세션 보드'
  const st = $('state'); st.replaceChildren()
  if (!LIVE) { st.className = 'state'; st.append('스냅샷 · ' + stamp(D.generated)) }
  else if (lost) { st.className = 'state bad'; st.append('연결 끊김') }
  else { st.className = 'state' + (D.session.busy ? ' run' : ''); if (D.session.busy) st.append(el('i', 'pulse')); st.append(D.session.busy ? '작업 중' : '대기 중') }
  $('foot').textContent = '세션 ' + D.session.id + (LIVE ? ' · 2초마다 새로 읽어요' : ' · ' + stamp(D.generated) + '에 만든 화면이에요')
}
// 글을 고르는 중에는 다시 그리지 않고, 고르기가 끝나면 그린다
let waiting = false
const selecting = () => { const s = getSelection(); return s && !s.isCollapsed && $('pane').contains(s.anchorNode) }
document.addEventListener('selectionchange', () => { if (waiting && !selecting()) draw() })
function draw() {
  if (selecting()) { waiting = true; return }
  waiting = false
  drawHead(); drawTabs()
  const pane = $('pane'), f = document.activeElement, fk = f && pane.contains(f) && f.dataset ? f.dataset.key : ''
  pane.replaceChildren(P[active]())
  pane.setAttribute('aria-label', NAME[active])
  if (fk) { const n = [...pane.querySelectorAll('[data-key]')].find(x => x.dataset.key === fk); if (n) n.focus({ preventScroll: true }) }
}

// ---- 실시간 갱신과 알림 ----
if (LIVE && 'Notification' in window) {
  const ck = $('notify'); $('noteRow').hidden = false
  ck.checked = Notification.permission === 'granted' && store.get('sb:notify', false)
  ck.onchange = async () => {
    if (ck.checked && Notification.permission !== 'granted' && await Notification.requestPermission() !== 'granted') ck.checked = false
    store.set('sb:notify', ck.checked)
  }
}
if (LIVE) {
  let sig = JSON.stringify({ ...D, generated: '' }), wasBusy = D.session.busy
  setInterval(async () => {
    try {
      const next = await (await fetch('/data?k=' + KEY, { cache: 'no-store' })).json(), s = JSON.stringify({ ...next, generated: '' })
      const back = lost; lost = false
      if (s === sig) { if (back) drawHead(); return }
      sig = s
      const finished = wasBusy && !next.session.busy; wasBusy = next.session.busy; D = next; draw()
      // 화면을 보고 있지 않을 때 Claude 가 턴을 마치면 알린다.
      if (finished && document.hidden && store.get('sb:notify', false) && 'Notification' in window && Notification.permission === 'granted') {
        const r = turns()[0]
        new Notification('Claude 가 답을 마쳤어요', { body: (D.session.title || '') + (r ? '\n' + plain(r.report).slice(0, 120) : '') })
      }
    } catch { if (!lost) { lost = true; drawHead() } }
  }, 2000)
}
// 「몇 분 전」 글자를 새로 맞춘다
setInterval(draw, 60000)
loadRead()
draw()
</script>
</body>
